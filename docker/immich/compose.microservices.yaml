#
# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich

services:
  immich-microservices:
    container_name: immich-microservices
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    extends:
      file: hwaccel.transcoding.yml
      service: nvenc # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Deliberately not ${UPLOAD_LOCATION} as upstream has it: this worker runs
      # on a different host than the server, so /data is the server's media
      # mounted over SMB rather than a local path. UPLOAD_LOCATION in .env is
      # the server's path and is meaningless here.
      - upload_location_share:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      IMMICH_WORKERS_INCLUDE: "microservices"
      REDIS_HOSTNAME: ${SERVER_ADDRESS}
      REDIS_PORT: "2284"
      DB_HOSTNAME: ${SERVER_ADDRESS}
      DB_PORT: "2285"
      DB_DATA_LOCATION: # unset
      UPLOAD_LOCATION: upload_location_share
    restart: unless-stopped
    healthcheck:
      # The microservices worker does not serve the API, so the image's default
      # healthcheck would always fail.
      disable: true

volumes:
  upload_location_share:
    driver_opts:
      type: cifs
      o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},uid=0,gid=0,vers=3.0"
      device: "//${SERVER_ADDRESS}/upload_location_share"
