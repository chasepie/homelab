[upload_location_share]
path = /srv/docker/immich/library
writeable = yes
browseable = yes
public = no
# The immich-server container writes into this tree as root, so files land
# root-owned 0755 and the authenticating SMB user cannot write them. Perform
# file operations as root so the remote microservices worker can write too.
# "writeable = yes" only grants permission at the Samba level -- the underlying
# Unix ownership still applies without this.
force user = root
force group = root
create mask = 0664
directory mask = 0775